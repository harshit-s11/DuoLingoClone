services:
  - type: web
    name: lingualquest-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:///./data/duolingo_clone.db
      - key: ENABLE_DEBUG
        value: "true"
